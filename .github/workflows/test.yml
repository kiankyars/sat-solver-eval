name: Harness and solver correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Offline harness tests
        run: python3 -m unittest discover -s tests -v
      - name: Build full pipeline and independent checker
        run: scripts/build_solver.sh
      - name: Exhaustive small-formula certificate tests
        run: SAT_EVAL_INTEGRATION=1 python3 -m unittest discover -s tests -p '*integration.py' -v
